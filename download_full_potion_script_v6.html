<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Алхимический котёл v6</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 48px auto; padding: 0 20px; background: #111; color: #eee; }
    button { font-size: 18px; padding: 14px 22px; cursor: pointer; }
    #status { margin-top: 18px; white-space: pre-wrap; color: #ccc; }
    code { color: #ffd76a; }
  </style>
</head>
<body>
  <h1>Алхимический котёл v6</h1>
  <p>Бутылка теперь выдаётся без проверки реестра Herbalist. После питья скрытый ванильный маркер запускает команды <code>minecraft:nausea</code> и <code>herbalistmod:delirium</code>.</p>
  <button id="download">Скачать полный исправленный TXT</button>
  <div id="status">Подготовка…</div>

<script>
const SOURCE_URL = 'https://raw.githubusercontent.com/Repipo/pipo/main/%D0%90%D0%BB%D1%85%D0%B8%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%BA%D0%BE%D1%82%D0%B5%D0%BB_%D1%80%D0%B2%D0%BE%D1%82%D0%BD%D0%BE%D0%B5_%D0%B7%D0%B5%D0%BB%D1%8C%D0%B5_%D0%B8_%D0%B0%D1%84%D1%80%D0%BE%D0%B4%D0%B8%D0%B7%D0%B8%D0%B0%D0%BA.txt';
const OUTPUT_NAME = 'Алхимический_котел_ИСПРАВЛЕННЫЙ_v6.txt';

const NEW_RECIPES = `  // ============================================
  // РВОТНАЯ НАСТОЙКА
  // Порядок: гнилая плоть -> ядовитый картофель -> ферментированный паучий глаз
  // Бутылка содержит только скрытый ванильный маркер.
  // Реальные nausea и herbalistmod:delirium выдаются после питья скриптом.
  // ============================================

  ctx.addRecipe(
    ctx.createCustomRecipe(
      'Рвотная настойка',
      [
        'minecraft:rotten_flesh',
        'minecraft:poisonous_potato',
        'minecraft:fermented_spider_eye',
      ],
      1,
      function (player, ctx) {
        var resultNbt =
          '{id:"minecraft:potion",Count:1b,tag:{' +
          'Potion:"minecraft:water",' +
          'CustomPotionColor:3555072,' +
          'HideFlags:32,' +
          'CustomPotionEffects:[' +
          '{Id:27b,Amplifier:30b,Duration:100,ShowParticles:0b,ShowIcon:0b}' +
          ']}}';

        return ctx.giveRecipeResult(
          player,
          resultNbt,
          'Рвотная настойка',
          'minecraft:block.brewing_stand.brew',
          '§2'
        );
      },
      true
    )
  );

  // ============================================
  // АФРОДИЗИАК
  // Порядок: бутылочка мёда -> сладкие ягоды -> мак
  // Полностью скриптовый, Brewin' and Chewin' не требуется.
  // ============================================

  ctx.addRecipe(
    ctx.createCustomRecipe(
      'Афродизиак',
      [
        'minecraft:honey_bottle',
        'minecraft:sweet_berries',
        'minecraft:poppy',
      ],
      1,
      function (player, ctx) {
        var resultNbt =
          '{id:"minecraft:potion",Count:1b,tag:{' +
          'Potion:"minecraft:water",' +
          'CustomPotionColor:16733695,' +
          'HideFlags:32,' +
          'CustomPotionEffects:[' +
          '{Id:26b,Amplifier:30b,Duration:100,ShowParticles:0b,ShowIcon:0b}' +
          ']}}';

        return ctx.giveRecipeResult(
          player,
          resultNbt,
          'Афродизиак',
          'minecraft:block.brewing_stand.brew',
          '§d'
        );
      },
      true
    )
  );

`;

const NEW_HANDLER = `  // ============================================
  // РВОТНАЯ НАСТОЙКА И СКРИПТОВЫЙ АФРОДИЗИАК
  // ============================================

  this.readSpecialEffectAmplifier = function (entry) {
    if (!entry) return -1;

    try { return entry.getInt('Amplifier'); } catch (err1) {}
    try { return entry.getByte('Amplifier'); } catch (err2) {}
    try { return entry.getInt('amplifier'); } catch (err3) {}
    try { return entry.getByte('amplifier'); } catch (err4) {}

    return -1;
  };

  this.hasSpecialEffectMarker = function (stringId, numericId, amplifier) {
    try {
      var list = this.getEffectListFromEntityNbt(this.player.getEntityNbt());
      if (!list) return false;

      for (var i = 0; i < list.size(); i++) {
        var entry = list.get(i);
        var matches = false;

        try {
          matches = this.effectEntryMatchesId(entry, stringId);
        } catch (errStringId) {}

        if (!matches) {
          try {
            matches = this.readNumericIdFromEffectEntry(entry) === numericId;
          } catch (errNumericId) {}
        }

        if (!matches) continue;

        if (this.readSpecialEffectAmplifier(entry) === amplifier) {
          return true;
        }
      }
    } catch (errMarker) {}

    return false;
  };

  this.startVomitPotion = function (now) {
    var playerName = String(this.player.getName());
    var temp = this.player.getTempdata();

    temp.put('RP_VomitUntil', now + 120000);
    temp.put('RP_VomitNext', now);
    temp.put('RP_VomitRunning', 1);

    this.runWorldCommand(this.world, 'effect clear ' + playerName + ' minecraft:unluck');
    this.runWorldCommand(this.world, 'effect give ' + playerName + ' minecraft:nausea 120 4 true');
    this.runWorldCommand(this.world, 'effect give ' + playerName + ' herbalistmod:delirium 120 1 true');
    this.runWorldCommand(this.world, 'effect give ' + playerName + ' minecraft:hunger 120 1 true');

    this.player.message('§2Желудок сводит чудовищной судорогой...');
    this.player.playSound('minecraft:entity.player.burp', 1, 0.38);

    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s anchored eyes run particle minecraft:item minecraft:slime_ball ' +
        '^ ^-0.28 ^0.52 0.35 0.22 0.35 0.15 60 force'
    );
    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s run particle minecraft:spore_blossom_air ~ ~1.35 ~ 0.7 0.55 0.7 0.04 55 force'
    );
  };

  this.startAphrodisiacPotion = function (now) {
    var playerName = String(this.player.getName());
    var temp = this.player.getTempdata();

    temp.put('RP_AphroUntil', now + 90000);
    temp.put('RP_AphroNext', now);
    temp.put('RP_AphroMessageNext', now + 12000);
    temp.put('RP_AphroRunning', 1);

    this.runWorldCommand(this.world, 'effect clear ' + playerName + ' minecraft:luck');

    this.player.message('§dПо телу разливается обжигающее тепло...');
    this.player.playSound('minecraft:block.amethyst_block.chime', 1, 1.25);
    this.player.playSound('minecraft:block.note_block.chime', 0.8, 1.65);

    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s run particle minecraft:heart ~ ~1.2 ~ 1.1 1.3 1.1 0.09 70 force'
    );
    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s run particle minecraft:cherry_leaves ~ ~1.1 ~ 1.3 1.3 1.3 0.06 55 force'
    );
  };

  this.processVomitPotion = function (now) {
    var temp = this.player.getTempdata();
    var until = Number(temp.get('RP_VomitUntil'));

    if (isNaN(until) || until <= 0) return;

    if (now >= until) {
      try {
        temp.remove('RP_VomitUntil');
        temp.remove('RP_VomitNext');
        temp.remove('RP_VomitRunning');
      } catch (errClearVomit) {}

      this.player.message('§7Приступ рвоты наконец ослабевает.');
      return;
    }

    var next = Number(temp.get('RP_VomitNext'));
    if (isNaN(next)) next = 0;
    if (now < next) return;

    temp.put('RP_VomitNext', now + 950 + Math.floor(Math.random() * 1350));

    var playerName = String(this.player.getName());
    var yaw = Math.floor(Math.random() * 361) - 180;
    var pitch = Math.floor(Math.random() * 81) - 40;

    this.runWorldCommand(
      this.world,
      'execute as ' + playerName + ' at @s run tp @s ~ ~ ~ ' + yaw + ' ' + pitch
    );

    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s anchored eyes run particle minecraft:item minecraft:slime_ball ' +
        '^ ^-0.30 ^0.50 0.25 0.17 0.25 0.14 42 force'
    );
    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s anchored eyes run particle minecraft:spore_blossom_air ' +
        '^ ^-0.26 ^0.47 0.30 0.20 0.30 0.04 34 force'
    );
    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s run particle minecraft:sneeze ~ ~1.35 ~ 0.35 0.28 0.35 0.07 20 force'
    );
    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s run playsound minecraft:entity.player.burp master ' +
        '@a[distance=..20] ~ ~ ~ 1.3 0.35'
    );
    this.runWorldCommand(
      this.world,
      'execute as ' + playerName +
        ' at @s run playsound minecraft:entity.generic.drink master ' +
        '@a[distance=..20] ~ ~ ~ 0.75 0.28'
    );
  };

  this.processAphrodisiacPotion = function (now) {
    var temp = this.player.getTempdata();
    var until = Number(temp.get('RP_AphroUntil'));

    if (isNaN(until) || until <= 0) return;

    if (now >= until) {
      try {
        temp.remove('RP_AphroUntil');
        temp.remove('RP_AphroNext');
        temp.remove('RP_AphroMessageNext');
        temp.remove('RP_AphroRunning');
      } catch (errClearAphro) {}

      this.player.message('§7Жар постепенно покидает тело.');
      return;
    }

    var playerName = String(this.player.getName());
    var next = Number(temp.get('RP_AphroNext'));
    if (isNaN(next)) next = 0;

    if (now >= next) {
      temp.put('RP_AphroNext', now + 850);

      this.runWorldCommand(
        this.world,
        'execute as ' + playerName +
          ' at @s run particle minecraft:heart ~ ~1.2 ~ 0.85 1.0 0.85 0.05 20 force'
      );
      this.runWorldCommand(
        this.world,
        'execute as ' + playerName +
          ' at @s run particle minecraft:cherry_leaves ~ ~1.0 ~ 0.95 1.05 0.95 0.04 22 force'
      );
      this.runWorldCommand(
        this.world,
        'execute as ' + playerName +
          ' at @s run particle minecraft:dust 1 0.08 0.38 1 ' +
          '~ ~1.05 ~ 0.8 0.95 0.8 0.025 22 force'
      );

      if (Math.random() < 0.28) {
        this.runWorldCommand(
          this.world,
          'execute as ' + playerName +
            ' at @s run playsound minecraft:block.amethyst_block.chime player ' +
            '@a[distance=..14] ~ ~ ~ 0.4 1.55'
        );
      }
    }

    var messageNext = Number(temp.get('RP_AphroMessageNext'));
    if (isNaN(messageNext)) messageNext = now + 12000;

    if (now >= messageNext) {
      temp.put('RP_AphroMessageNext', now + 15000 + Math.floor(Math.random() * 9000));

      var messages = [
        '§dСердце начинает биться гораздо быстрее...',
        '§dВзгляд невольно задерживается на окружающих...',
        '§dПо коже проходит новая волна горячего покалывания...',
        '§dДыхание становится заметно чаще...',
      ];

      this.player.message(messages[Math.floor(Math.random() * messages.length)]);
    }
  };

  this.processSpecialPotionEffects = function () {
    if (!this.player) return;

    var now = new Date().getTime();

    if (this.hasSpecialEffectMarker('minecraft:unluck', 27, 30)) {
      this.startVomitPotion(now);
    }

    if (this.hasSpecialEffectMarker('minecraft:luck', 26, 30)) {
      this.startAphrodisiacPotion(now);
    }

    this.processVomitPotion(now);
    this.processAphrodisiacPotion(now);
  };

`;

function replaceBetween(text, startMarker, endMarker, replacement) {
  const start = text.indexOf(startMarker);
  if (start < 0) throw new Error('Не найден маркер начала: ' + startMarker.split('\n').pop());
  const end = text.indexOf(endMarker, start);
  if (end < 0) throw new Error('Не найден маркер конца: ' + endMarker.split('\n').pop());
  return text.slice(0, start) + replacement + text.slice(end);
}

function ensureEventCall(text, functionName) {
  const start = text.indexOf('function ' + functionName + '(event)');
  if (start < 0) throw new Error('Не найдена функция ' + functionName);
  const end = text.indexOf('\n}', start) + 2;
  let block = text.slice(start, end);

  if (!block.includes('playerObject.processSpecialPotionEffects();')) {
    block = block.replace(
      '  playerObject.processPendingDrops();\n}',
      '  playerObject.processPendingDrops();\n  playerObject.processSpecialPotionEffects();\n}'
    );
  }

  return text.slice(0, start) + block + text.slice(end);
}

async function buildAndDownload() {
  const status = document.getElementById('status');
  const button = document.getElementById('download');
  button.disabled = true;
  status.textContent = 'Собираю полный исправленный Player Script…';

  try {
    const response = await fetch(SOURCE_URL + '?v=6', { cache: 'no-store' });
    if (!response.ok) throw new Error('Не удалось загрузить исходник: HTTP ' + response.status);

    let text = await response.text();

    text = replaceBetween(
      text,
      '  // ============================================\n  // НОВОЕ: РВОТНАЯ НАСТОЙКА',
      '  // ============================================\n  // СЛАБЫЕ РЕЦЕПТЫ',
      NEW_RECIPES
    );

    text = replaceBetween(
      text,
      '  // ============================================\n  // НОВОЕ: РВОТА И АФРОДИЗИАК',
      '  // ============================================\n  // ВЫДАЧА РЕЗУЛЬТАТОВ',
      NEW_HANDLER
    );

    text = ensureEventCall(text, 'tick');

    const forbidden = [
      'resolveMobEffectNumericIdWithoutProbe',
      'Не найден эффект herbalistmod:delirium',
      'giveVomitPotion = function'
    ];

    for (const value of forbidden) {
      if (text.includes(value)) throw new Error('В итоговом файле остался старый код: ' + value);
    }

    const required = [
      "effect give ' + playerName + ' minecraft:nausea 120 4 true",
      "effect give ' + playerName + ' herbalistmod:delirium 120 1 true",
      "this.hasSpecialEffectMarker('minecraft:unluck', 27, 30)",
      'playerObject.processSpecialPotionEffects();',
      "'Рвотная настойка'",
      "'Афродизиак'"
    ];

    for (const value of required) {
      if (!text.includes(value)) throw new Error('Проверка не пройдена: ' + value);
    }

    const blob = new Blob(['\ufeff', text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = OUTPUT_NAME;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    status.textContent = 'Готово. Полный TXT скачан. Забор бутылки больше не проверяет эффект Herbalist.';
  } catch (error) {
    console.error(error);
    status.textContent = 'Ошибка: ' + error.message;
  } finally {
    button.disabled = false;
  }
}

document.getElementById('download').addEventListener('click', buildAndDownload);
window.addEventListener('load', () => setTimeout(buildAndDownload, 400));
</script>
</body>
</html>
