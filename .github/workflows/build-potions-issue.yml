name: Build potion script from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.issue.title, 'run-potion-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate full replacement script
        run: python3 build_potions.py

      - name: Commit generated file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Алхимический_котел_рвотная_настойка_и_скриптовый_афродизиак.txt'
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Собрать полный скрипт зелий'
          git push origin main
